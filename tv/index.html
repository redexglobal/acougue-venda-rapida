<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel de preços · TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@600;800;900&family=Bebas+Neue&family=Inter:wght@400;600;800&family=Kalam:wght@400;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #tela{position:fixed;top:0;right:0;bottom:0;left:0}
  #cheia{position:fixed;right:14px;bottom:14px;z-index:9;opacity:0;transition:opacity .3s;background:rgba(0,0,0,.6);color:#fff;border:1px solid #555;border-radius:10px;padding:10px 14px;font:600 15px system-ui;cursor:pointer}
  body:hover #cheia,#cheia:focus{opacity:1}
  #aviso{position:fixed;top:0;right:0;bottom:0;left:0;display:none;place-items:center;color:#ddd;font:500 20px system-ui;text-align:center;padding:30px;background:#111}
  /* 24/11/2026: senha chamada, por cima dos preços */
  #senhaTV{position:fixed;left:50%;top:50%;z-index:8;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;
    background:var(--fd,#111);color:var(--tx,#fff);border:.6vh solid var(--dz,#ff6a3d);border-radius:3vh;padding:3vh 6vh;text-align:center;font-family:Archivo,system-ui,sans-serif;box-shadow:0 0 0 100vmax rgba(0,0,0,.55),0 0 8vh var(--dz,#ff6a3d)}
  #senhaTV.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #senhaTV small{display:block;font-weight:800;letter-spacing:.2em;font-size:3vh;opacity:.85}
  #senhaTV b{display:block;font-weight:900;font-size:22vh;line-height:1;color:var(--dz,#ff6a3d)}
  #senhaTV span{display:block;font-weight:800;font-size:7vh;line-height:1.1}
  #faixaSenha{position:fixed;left:0;right:0;bottom:0;height:9vh;z-index:7;display:none;gap:2.4vw;align-items:center;justify-content:center;background:#0b0b0b;color:#fff;border-top:.5vh solid var(--dz,#ff6a3d);font:800 4vh Archivo,system-ui,sans-serif}
  #faixaSenha .at{font-size:6vh;color:var(--dz,#ff6a3d)}
  #faixaSenha .ul{opacity:.65;font-size:3vh}
  #faixaSenha.tem{display:flex}
  body.comFila #tela{bottom:9vh}
  #somAviso{position:fixed;left:14px;bottom:14px;z-index:9;background:rgba(0,0,0,.7);color:#fff;border:1px solid #777;border-radius:10px;padding:10px 14px;font:600 15px system-ui;cursor:pointer}
  @media (prefers-reduced-motion:reduce){#senhaTV{transition:none}}
</style>
</head>
<body>
<div id="tela"></div>
<button id="cheia" type="button">Tela cheia</button>
<div id="aviso" role="alert"></div>
<div id="carencia" role="alert" style="position:fixed;left:0;right:0;top:0;z-index:9;display:none;background:#b3261e;color:#fff;text-align:center;font:800 2.6vh Archivo,system-ui,sans-serif;padding:.8vh"></div>
<div id="senhaTV" aria-live="assertive"><small>SENHA</small><b id="sNum"></b><span id="sNome"></span></div>
<div id="faixaSenha"><span>SENHA</span><span class="at" id="fNum"></span><span id="fNome"></span><span class="ul" id="fUlt"></span></div>
<button id="somAviso" type="button" hidden>Toque para ligar o som das senhas</button>
<!-- 26/11/2026: código num arquivo só, compatível com navegador de TV antiga (fonte: tv/app.js; gerar de novo ao mudar painel.js) -->
<script src="/tv/tv.js"></script>
</body>
</html>
